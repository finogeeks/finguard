replicaCount: 2

image:
  repository: ghcr.io/finogeeks/finguard
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  grpcPort: 19090
  httpPort: 8088
  gatewayPort: 13000

# Same-pod agentgateway talks to FinGuard on loopback. Turn on for an
# existing off-loopback gateway and create tls.secretName first.
tls:
  enabled: false
  secretName: finguard-grpc-tls

oidc:
  issuer: ""
  audience: finguard
  # RS256 JWKS URL → FINGUARD_OIDC_JWKS_URL. Empty = stub identity (lab / first start).
  # Customer procedure: docs/identity-iam.md (issuer + audience + JWKS; not HS256).
  jwksUrl: ""

# Empty = chart creates Secret finguard-admin.
adminTokenExistingSecret: ""

postgres:
  # Default: chart starts Postgres. Set false and urlExistingSecret to use yours.
  bundled: true
  image: postgres:16-alpine
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
  urlExistingSecret: ""

# Same image as FinGuard. Sidecar shares the pod network (127.0.0.1).
# Set enabled: false for existing-gateway (customer Envoy/APISIX).
agentgateway:
  enabled: true
  backendHost: "erp.example.svc:80"
  pathPrefix: /writes

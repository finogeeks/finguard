apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguard
  labels:
    app: finguard
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: finguard
  template:
    metadata:
      labels:
        app: finguard
    spec:
      {{- if .Values.agentgateway.enabled }}
      shareProcessNamespace: true
      {{- end }}
      {{- if or .Values.postgres.bundled .Values.agentgateway.enabled }}
      initContainers:
        {{- if .Values.postgres.bundled }}
        - name: wait-postgres
          image: {{ .Values.postgres.image | quote }}
          command:
            - sh
            - -c
            - until pg_isready -h finguard-postgres -U finguard -d finguard; do sleep 2; done
        {{- end }}
        {{- if .Values.agentgateway.enabled }}
        - name: seed-gateway-runtime
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - '[ -f /runtime/agentgateway.yaml ] || cp /bootstrap/agentgateway.yaml /runtime/agentgateway.yaml'
          volumeMounts:
            - name: agentgateway-config
              mountPath: /bootstrap
              readOnly: true
            - name: gateway-runtime
              mountPath: /runtime
        {{- end }}
      {{- end }}
      {{- if or .Values.agentgateway.enabled .Values.tls.enabled }}
      volumes:
        {{- if .Values.agentgateway.enabled }}
        - name: agentgateway-config
          configMap:
            name: finguard-agentgateway
        - name: gateway-runtime
          emptyDir: {}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: finguard-tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
      {{- end }}
      containers:
        - name: finguard
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --bind
            - "0.0.0.0:{{ .Values.service.grpcPort }}"
            - --http-bind
            - "0.0.0.0:{{ .Values.service.httpPort }}"
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
            - name: http
              containerPort: {{ .Values.service.httpPort }}
          env:
            {{- if .Values.image.digest }}
            - name: FINGUARD_IMAGE_DIGEST
              value: {{ .Values.image.digest | quote }}
            {{- end }}
            - name: FINGUARD_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FINGUARD_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: FINGUARD_OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            {{- if .Values.oidc.jwksUrl }}
            - name: FINGUARD_OIDC_JWKS_URL
              value: {{ .Values.oidc.jwksUrl | quote }}
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: FINGUARD_TLS_CERT
              value: /tls/tls.crt
            - name: FINGUARD_TLS_KEY
              value: /tls/tls.key
            {{- end }}
            {{- if .Values.adminTokenExistingSecret }}
            - name: FINGUARD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminTokenExistingSecret }}
                  key: token
            {{- else }}
            - name: FINGUARD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: finguard-admin
                  key: token
            {{- end }}
            {{- if .Values.postgres.urlExistingSecret }}
            - name: FINGUARD_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.urlExistingSecret }}
                  key: url
            {{- else if .Values.postgres.bundled }}
            - name: FINGUARD_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: finguard-postgres
                  key: url
            {{- end }}
            {{- if .Values.agentgateway.enabled }}
            - name: FINGUARD_DATAPLANE_YAML
              value: /etc/finguard/agentgateway.yaml
            - name: FINGUARD_DATAPLANE_RELOAD_CMD
              value: "sh -c 'for d in /proc/[0-9]*; do tr \"\\0\" \" \" < \"$d/cmdline\" 2>/dev/null | grep -q \"[a]gentgateway\" && kill -HUP \"${d#/proc/}\"; done'"
            {{- end }}
          {{- if or .Values.agentgateway.enabled .Values.tls.enabled }}
          volumeMounts:
            {{- if .Values.agentgateway.enabled }}
            - name: gateway-runtime
              mountPath: /etc/finguard
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: finguard-tls
              mountPath: /tls
              readOnly: true
            {{- end }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 5
        {{- if .Values.agentgateway.enabled }}
        - name: agentgateway
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/agentgateway"]
          args: ["-f", "/etc/finguard/agentgateway.yaml"]
          ports:
            - name: gateway
              containerPort: {{ .Values.service.gatewayPort }}
          volumeMounts:
            - name: gateway-runtime
              mountPath: /etc/finguard
              readOnly: true
        {{- end }}

{{- if not .Values.adminTokenExistingSecret }}
{{- $token := randAlphaNum 32 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "finguard-admin" }}
{{- if and $existing $existing.data $existing.data.token }}
{{- $token = index $existing.data "token" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: finguard-admin
  labels:
    app: finguard
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
